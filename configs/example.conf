
= general =
// The title of the variant
Example Variant

// The initial board position in Cheesy Forsyth-Edwards Notation (CFEN)
// The dimensions of the board are determined by the number of ranks and files
// in this section.
//
// This starting position will also be used to determine if the peices have
// moved or not for the purposes of castling rights and move patterns that
// depend on whether a piece has moved or not.
rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq * -/-

// These are all the special rules that can be enabled for a variant. Each rule
// is comma-separated and the order in which they are listed does not matter.
// The rules that are enabled in this section will determine which sections must
// be included in the config file and how the CFEN string should be formatted.
// If a rule is enabled but the corresponding sections or CFEN formatting is not
// correct, it will throw an error when parsing the config file.
= rules =

// Enables castling for the variant. If enabled, the castling rights in the CFEN
// string will be parsed and applied. If disabled, the all CFEN for this variant
// should not have any castling rights otherwise it will throw an error
castling

// Enables en passant for the variant. If enabled, the en passant square in the
// CFEN string will be parsed and applied. If disabled, the all CFEN for this
// variant should not have an en passant square (indicated by *) otherwise it
// will throw an error. Pieces that have 'p' or 't' on their move patterns will
// also throw an error if this is disabled since they rely on en passant
// captures.
en passant

// Enables promotions for the variant. If enabled, the = promotions =, and one of
// either = mandatory promotion zones = or = optional promotion zones = section of
// the config must exist. Not every piece has to have a promotion defined in the
// = promotions = section, but any piece that can promote must have either its
// mandatory or optional promotion zone defined. if disabled, all = promotions =,
// = mandatory promotion zones =, and = optional promotion zones = sections should
// not exist otherwise it will throw an error.
promotions

// This rule states that pieces in the player's hand can be dropped onto the
// board instead of making a normal move. If enabled, the in hand pieces in the
// CFEN string will be parsed and applied. If disabled, the all CFEN for this
// variant should not have any pieces in hand (indicated by -/-) otherwise it
// will throw an error. There is an additional optional = drop rules = section
// in the config file that defines special rules for some pieces
drops

// This rule sets forbidden zones in which pieces cannot move into. This affects
// normal moves, promotion options, and drops. If enabled, the forbidden zones
// are defined in the = forbidden zones = section of the config file. If disabled,
// the = forbidden zones = section should not exist otherwise it will throw an
// error. Not all pieces have to have forbidden zones defined, but any piece
// that can move into a forbidden zone must have its forbidden zones defined in
// the = forbidden zones = section of the config file.
forbidden zones

// This rule states that pieces that promote upon reaching the promotion zone
// must be a piece that has been captured previously by the opponent. This rule
// requires promotions to be enabled. this option requires the CFEN for this
// variant should not have any pieces in hand (indicated by -/-) otherwise it
// will throw an error.
promote to captured

// This rule states that at the beginning of the game, players have pieces in
// hand that they must drop onto the board before making any normal moves. If
// enabled, the in hand pieces in the CFEN string will be parsed and applied.
// The setup phase will start at the initial position until both players have
// no pieces in hand. When parsing a fen, the game will assume setup phase when
// there is no royal piece on the board, otherwise it will assume setup phase
// is over.
setup phase

// This section defines the variant's terminal rules -- how the game is won,
// lost, or drawn beyond the checkmate the engine always detects. It is one
// flat "name: args" line per rule; the section is optional and any rule not
// listed keeps its default. Outcomes are named from the perspective of the
// side the rule is about, and are one of: draw, win, loss.
//
//   checkmate: <outcome>
//     Result of a no-legal-move position while in check. Default loss (the
//     mated side loses); antichess-style variants may override.
//
//   stalemate: <outcome>
//     Result of a no-legal-move position while NOT in check. Default draw;
//     set "loss" for xiangqi/shogi-style variants.
//
//   repetition: <n> <outcome>
//     Fires when the current position has occurred <n> times. Default
//     outcome draw. Subsumes stand-off/facing draws: a persistent stand-off
//     repeats and this rule draws it.
//
//   counter: <n> <pieces|-> [<outcome>]
//     The generalized 50-move rule. Draws (or <outcome>) after <n> halfmoves
//     with no capture, no drop, and no non-capturing move by one of <pieces>
//     ("-" for none: captures/drops still reset it). Captures and drops always
//     reset the counter. The counter value is shown in the CFEN halfmove field
//     only when this rule is present. Makruk's board's-honour count (neither
//     king bare) is "counter: 64 - draw".
//
//   counting: <name> [<outcome>]
//     The makruk-family pieces' honour count for a bare-king endgame. When
//     exactly one side is reduced to a lone royal, the side with material must
//     mate within a move budget or the game is <outcome> (default draw). The
//     count is a frozen clock: it starts at the piece total when the bare-king
//     situation arises and ticks up by one every ply, never resetting on a
//     capture (so unlike counter it does not use the halfmove field). The
//     budget comes from a = counting <name> = section of ordered
//     "<pieces>: <limit>" rows, first fully-matched row winning, where a piece
//     letter repeated demands that many of the material side's copies (e.g.
//     "RR: 8" needs two rooks, "R: 16" one), plus a "default: <limit>"
//     fallback. Makruk is "counting: makruk draw".
//
//   checks: <n> [<outcome>]
//     The side that gives its <n>th check gets <outcome> (default win).
//     Three-check is "checks: 3 win".
//
//   extinct: <any|own|opp> <set> [<count>] <outcome>
//     When a colour's count of the <set> pieces (a char list like Pp, or *
//     for every piece) falls to <count> (default 0), that colour gets
//     <outcome> -- or its opponent, with "opp". Checked after captures.
//     List one line per piece type for extinction chess; one Pp line for
//     kinglet ("extinct: any Pp loss"); "extinct: own * win" for antichess.
//
//   goal: <set> <zone> <outcome>
//     When the side to move lands a <set> piece on a square of the named
//     <zone>, it gets <outcome>. The zone is a = zone <zone> = section
//     parsed like a forbidden zone (X marks a target square). King-of-the-
//     hill is "goal: Kk center win" with a centre zone.
//
//   perpetual: [check <outcome>] [chase <outcome>] [exempt <pieces>]
//     Refines the repetition rule: when a repetition closes, a side that was
//     the sole aggressor sustaining it gets <outcome> (a loss) instead of the
//     repetition result. "check" fires when that side gave check on every one
//     of its cycle moves; "chase" fires when it kept the same enemy non-royal
//     piece under an undefended threat on every one of them, tracked by
//     identity as it flees square to square. "exempt" lists pieces whose
//     threats never count as a chase (xiangqi exempts general and soldier).
//     Check outranks chase; if both sides offend the repetition result stands.
//     Needs a repetition rule to trigger. Xiangqi is
//     "perpetual: check loss chase loss exempt KkPp".
//
//   adjudicate: <name>
//     When both sides pass in succession (agreeing to end), decide the
//     position by weighted material instead of drawing. Each colour's counted
//     pieces are multiplied by their point weight and summed with that
//     colour's handicap; the greater sum wins, an equal sum draws. The weights
//     and handicap come from a = adjudicate <name> = section of "<piece>:
//     <weight>" lines (a weight applies to both colours of the piece) and an
//     optional "handicap: <w|b> <value>" line. Janggi points scale the point
//     values by two so the second player's 1.5-point handicap stays integral.
= termination =
stalemate: loss
repetition: 3 draw
counter: 100 Pp
counting: honour draw
checks: 3 win
extinct: any Pp loss
goal: Kk center win
perpetual: check loss chase loss exempt KkPp
adjudicate: pts

// Point weights for an "adjudicate:" line above, one "<piece>: <weight>" per
// line (applied to both colours) plus an optional handicap for one side.
= adjudicate pts =
Q: 18
R: 10
B: 6
N: 6
P: 2
handicap: b 1

// Move budgets for a "counting:" line above: ordered "<pieces>: <limit>" rows
// (first fully-matched wins; a repeated piece letter demands that many copies)
// plus a "default:" fallback. The material side must mate before the count
// reaches the limit or the bare-king side is counted out to <outcome>.
= counting honour =
RR: 8
R: 16
BB: 22
NN: 32
B: 44
default: 64

// A goal zone, referenced by name from a "goal:" line above. X marks a
// square of the zone; the layout matches the board like a forbidden zone.
= zone center =
8/8/8/3XX3/3XX3/8/8/8

// this section defines specific rules for castling. this section must contain
// 9 lines, the first one lists all pieces involved in castling.
//
// The next 4 lines contains the starting fen for castling patterns.
//
// * denotes squares the should not be attacked and should be empty when 
// performing castling
// + denotes squares that should be empty when performing castling
//
// if the variant has multiple castling posibilities, the bitfen is separated
// by |
//
// The next 4 lines denotes the ending configuration of the castling move. it
// must map 1-to-1 with the starting configutation
//
// K denotes castling move the will void the K castling right, etc.
= castling =
pieces:KRkr
K:8/8/8/8/8/8/8/4K**R
Q:8/8/8/8/8/8/8/R+**K3
k:4k**r/8/8/8/8/8/8/8
q:r+**k3/8/8/8/8/8/8/8
K:8/8/8/8/8/8/8/5RK1
Q:8/8/8/8/8/8/8/2KR5
k:5rk1/8/8/8/8/8/8/8
q:2kr5/8/8/8/8/8/8/8


// In this section the pieces and their corresponding characters in the CFEN
// string are defined. Each line corresponds to a piece and is formatted as
// follows:
//
// (characters):(name)
//
// The characters are the ones that will be used in the CFEN string to represent
// that piece. The first character in the characters will represent the white
// version of the piece and the second character will represent the black
// version of the piece.
= pieces =

Pp:Pawn

