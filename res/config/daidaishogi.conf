// Dai Dai Shogi (大大将棋), the 17x17 great great shogi. 96 pieces a side,
// no drops, and no promotion zone at all: a piece promotes at the end of its
// first capturing move, compulsorily, and never again.
//
// That rule is written on the pieces rather than in a trigger. Each of the
// twenty-one types that can promote is given a promotion zone covering the
// whole board and is written twice over -- a quiet leg, and an `r` capture leg
// that may only be played as a promotion. `r` is legal wherever its leg
// touches a zone, which here is everywhere, so every capture promotes and no
// quiet move ever does. `entry` is named alone for the same reason: with the
// zone covering the board there is nowhere outside it to cross in from, so the
// trigger can never fire.
//
// Two of the twenty-one promote into a type that promotes again -- eastern
// barbarian into the lion, western barbarian into the lion dog -- so those two
// targets are spent copies carrying the moves without the promotion.
//
// Latin letters name the pieces a shogi player already knows. Greek, Cyrillic
// and Armenian name the rest, and the header of each block below says which.

