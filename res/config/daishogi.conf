// Every piece that can promote is written three times over: a quiet leg, an
// `r` capture leg that may only be played as a promotion, and a `!r` capture
// leg that may only be played without one. `r` is legal solely where the leg
// touches a promotion zone, so the pair says "a capture in the camp promotes
// or does not, your choice, and a capture outside it never does" without the
// zones needing a second trigger to describe it. The pieces that cannot
// promote are written once, plainly.
