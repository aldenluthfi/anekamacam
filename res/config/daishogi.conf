// Dai Shogi (大将棋), the 15x15 great shogi. 65 pieces a side, no drops.
//
// Twenty-nine piece types start on the board and eight more exist only as
// promotions. Eight further types are spent copies: a starting type's moves
// with no promotion of its own, because a piece promotes once and once only.
// Nine of the small pieces all promote to the one spent gold, which is why
// the copies are named for what they move like and not for what they were.
//
// Latin letters name most starting types, Greek and Cyrillic the rest:
//
//   Ц cat sword          Γ flying stag    +blind tiger
//   Ч iron general       Δ whale          +reverse chariot
//   Ш stone general      Θ white horse    +lance
//                        Λ flying ox      +vertical mover
//   Ψ spent gold general Ξ free boar      +side mover
//   Ω spent drunk elephant                Π soaring eagle  +dragon king
//   Ж spent rook         Σ horned falcon  +dragon horse
//   И spent vertical mover                Φ prince         +drunk elephant
//   Щ spent side mover
//   Э spent bishop
//   Ю spent dragon king
//   Я spent dragon horse

