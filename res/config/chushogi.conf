// Chu Shogi (中将棋), the 12x12 middle shogi. 46 pieces a side, no drops.
//
// Twenty-one piece types start on the board and eight more exist only as
// promotions. Eight further types are copies of a starting type that carry
// its moves but no promotion of their own: chu shogi promotes a piece once
// and once only, so a pawn that became a gold must not go on to become a
// rook the way a gold that started as a gold may. The copies are what keeps
// those two golds apart.
//
// The bare-king rule is "extinct: !KkJj loss": a side reduced to royals and
// nothing else loses on the spot. The association's two escapes from it are
// not modelled -- baring the opponent straight back does not draw, and taking
// their last royal in reply does not win, because the rule fires the instant
// the material is gone and no reply follows it.
//
// Latin letters name the starting types, Greek and Cyrillic the rest:
//
//   Γ flying stag     +blind tiger        Λ gold          +pawn
//   Δ whale           +reverse chariot    Ξ drunk elephant+go-between
//   Θ white horse     +lance              Π rook          +gold
//                                         Σ vertical mover+silver
//   J prince          +drunk elephant     Φ side mover    +copper
//   W soaring eagle   +dragon king        Ψ bishop        +ferocious leopard
//   U horned falcon   +dragon horse       Ω dragon king   +rook
//   Y flying ox       +vertical mover     Ж dragon horse  +bishop
//   Z free boar       +side mover

