// A promotable piece is written twice: a quiet leg, and an `r` capture leg
// that may only be played as a promotion. With the zone covering the board
// every capture promotes and no quiet move ever does.
//
// The six range-capturers are the exception, and promotion is merely
// optional for them. Their ray is one repeated leg that has to carry `m`,
// `c` and `d` at once, because it flies through empty squares and occupied
// ones in the same sweep; there is no separate capturing leg to hang `r`
// on. So the wrapper yields the same ray twice, once promoting and once
// not, and the mover picks. Compulsory promotion here would need a leg
// modifier that fires only when the leg actually took something.
//
// The hook movers and the lions have the same shape of problem and take
// the other answer: their chained legs sit outside the wrapper, so those
// legs never promote. Inside it a hook could capture on its turning leg
// and a lion could play its capture-then-step double as a quiet one, both
// of which are worse than a missing promotion.
