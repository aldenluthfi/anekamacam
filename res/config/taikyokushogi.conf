// Taikyoku Shogi (大局将棋), the 36x36 ultimate shogi: 402 pieces a side,
// 209 types on the board and 92 more that exist only as promotions. No
// drops. Built from the English Wikipedia article, whose own piece table,
// abbreviation legend and board diagram agree on 209 codes and 402 pieces.
//
// Promotion is disputed between the sources. This config takes the first
// reading -- a piece promotes at the end of its first capturing move --
// written the way dai dai writes it: a board-wide zone so the `r` capture
// legs are legal everywhere, and `entry` alone, which can never fire
// because nothing is ever outside the zone to cross in from. The other
// reading, compulsory promotion on entering the far eleven ranks, is the
// same file with that zone cut to eleven ranks and `rc` legs made plain.
//
// Six pieces fly along a line and remove everything they pass over. The
// sources are plain that this spares nothing: friendly pieces burn too, so
// the legs are `mcd`, `d` being destroy-a-friendly. What they cannot touch
// is anything that outranks them, which is `!g` against the = piece ranks =
// hierarchy below: royals above the great general, above the vice general,
// above the other four. Played straight this is brutal -- a general opens
// hemmed in by its own army, so most of its moves immolate that army -- but
// that is the rule. The one liberty taken is the landing square: nothing
// here stops a general ending its flight on a friendly piece it destroys,
// and the sources do not say whether that is allowed.
//
// Approximated: ancient dragon, free bird, gold bird, great elephant,
// rain demon, treacherous fox.
// Their notation carries a hopper term the movement language has no word
// for; their ranging halves are faithful and the hop is missing.

