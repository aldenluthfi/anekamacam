= piece moves =
// Pawn: steps one forward and captures diagonally, en passant. From its
// second rank it steps two, and the square passed is open to en passant,
// as in standard.conf. From its first rank it steps two too, but the
// square passed is not, as in Fairy-Stockfish and Lichess.
Pp:mnW|m<nW-pnW>@@sW~*?@sW{2}~*?|m<nW-nW>@@@sW~*?|tcnF
// Rook: slides any distance orthogonally.
Rr:R
// Knight: (1,2) leaper.
Nn:N
// Bishop: slides any distance diagonally.
Bb:B
// Queen: slides any distance in any direction.
Qq:Q
// King: one step any direction.
Kk:K

