// capture or check a king. An enemy piece next to a bodyguard can move only
// one square, and an enemy piece that slides onto a square next to it must
// stop there. Thus each slide of two or more squares has its own branch,
// with stoppers on all squares next to its origin and to the squares it
// passes. The knight leaps and the king steps, so the bodyguard does not
// stop them. A pawn can go one, two or three squares on its first move.
